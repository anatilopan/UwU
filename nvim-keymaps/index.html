<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neovim keymaps</title>
    <style>
        /* #region Fonts (from maw) */
        @font-face {
            font-family: "Andada Pro";
            src: url("fonts/AndadaPro-VariableFont_wght.woff2") format("woff2");
            font-weight: 400 800;
            font-display: swap;
        }

        @font-face {
            font-family: "Source Sans 3";
            src: url("fonts/SourceSans3-VariableFont_wght.woff2") format("woff2");
            font-weight: 200 900;
            font-display: swap;
        }

        @font-face {
            font-family: "Source Code Pro";
            src: url("fonts/SourceCodePro-VariableFont_wght.woff2") format("woff2");
            font-weight: 200 900;
            font-display: swap;
        }
        /* #endregion */

        /* #region Base (from maw main.css) */
        :root {
            --bg-color: #12181f;
            --surface-color: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-secondary-alternative: #b89494;
            --accent-color: #f63b3b;
            --color-transition: color 0.2s ease-in-out, background-color 0.2s ease-in-out;
            --font-family-title: "Andada Pro", serif;
            --font-family-content: "Source Sans 3", sans-serif;
            --font-family-mono: "Source Code Pro", Consolas, Menlo, Monaco, monospace;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8fafc;
                --surface-color: #e2e8f0;
                --text-primary: #1e293b;
                --text-secondary: #64748b;
                --text-secondary-alternative: #3b1e1e;
                --accent-color: #c92222;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
            background-color: var(--bg-color);
        }

        body {
            font-family: var(--font-family-content);
            font-size: 1.8rem;
            line-height: 1.6;
            width: min(120rem, 100% - 3.2rem);
            margin: 0 auto 6rem;
            color: var(--text-primary);
            transition: var(--color-transition);
        }

        h1,
        h2 {
            font-family: var(--font-family-title);
            font-weight: 600;
            margin: 0 0 0.5rem;
        }

        h1 {
            font-size: 3.2rem;
        }

        h2 {
            font-size: 2.2rem;
        }

        p {
            margin: 0.5rem 0;
        }

        code,
        kbd {
            font-family: var(--font-family-mono);
            font-size: 0.9em;
        }

        code {
            background-color: var(--surface-color);
            padding: 0.1rem 0.4rem;
        }

        kbd {
            display: inline-block;
            border: 1px solid var(--text-secondary);
            border-radius: 0.5rem;
            min-width: 2.4rem;
            padding: 0 0.5rem;
            margin: 0.1rem 0.2rem 0.1rem 0;
            text-align: center;
            line-height: 1.5;
            white-space: nowrap;
        }

        kbd:hover {
            background-color: var(--text-secondary);
            color: var(--bg-color);
            border-color: var(--surface-color);
        }

        .divider {
            position: relative;
            border-bottom: 1px solid var(--text-secondary);
            margin: 2rem 0;
        }

        .divider::before {
            position: absolute;
            content: "";
            width: 11px;
            height: 11px;
            border: 1px solid var(--text-secondary);
            left: 50%;
            margin-left: -6px;
            margin-top: -6px;
            top: 50%;
            background: var(--bg-color);
            transform: rotate(45deg);
        }

        /* maw section corners that appear on hover */
        section {
            position: relative;
            padding: 1rem;
            margin: 1.5rem 0;
        }

        section::before,
        section::after {
            content: "";
            width: 1rem;
            height: 2rem;
            position: absolute;
            opacity: 0;
            transition: all 0.5s;
        }

        section::before {
            top: -10px;
            left: -5px;
            border-left: 1px solid var(--text-secondary);
            border-top: 1px solid var(--text-secondary);
        }

        section::after {
            bottom: -10px;
            right: 0;
            border-right: 1px solid var(--text-secondary);
            border-bottom: 1px solid var(--text-secondary);
        }

        section:hover::before {
            top: -1px;
            opacity: 1;
        }

        section:hover::after {
            bottom: -5px;
            opacity: 1;
        }
        /* #endregion */

        /* #region Page */
        header {
            padding-top: 3rem;
            text-align: center;
        }

        .meta {
            color: var(--text-secondary);
            font-size: 1.5rem;
        }

        .controls {
            position: sticky;
            top: 0;
            z-index: 1;
            background-color: var(--bg-color);
            padding: 1rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            align-items: center;
        }

        #search {
            flex: 1 1 32rem;
            font: inherit;
            font-family: var(--font-family-mono);
            font-size: 1.7rem;
            color: var(--text-primary);
            background-color: var(--surface-color);
            border: 1px solid var(--text-secondary);
            border-left: 2px solid var(--text-secondary-alternative);
            padding: 0.8rem 1.2rem;
            outline: none;
        }

        #search:focus {
            border-color: var(--accent-color);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 1.6rem;
            color: var(--text-secondary);
            font-size: 1.6rem;
            user-select: none;
        }

        .filters label {
            cursor: pointer;
            white-space: nowrap;
        }

        .filters input {
            accent-color: var(--accent-color);
        }

        #count {
            color: var(--text-secondary);
            font-size: 1.5rem;
            white-space: nowrap;
        }

        h2 small {
            font-family: var(--font-family-content);
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 0.8rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.6rem;
        }

        th {
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--text-secondary);
            padding: 0.4rem 0.8rem;
        }

        td {
            padding: 0.4rem 0.8rem;
            vertical-align: top;
            border-bottom: 1px solid var(--surface-color);
        }

        tr:hover td {
            background-color: var(--surface-color);
        }

        td.keys {
            width: 22%;
        }

        td.mode {
            width: 7%;
            font-family: var(--font-family-mono);
            font-size: 1.4rem;
            color: var(--text-secondary);
        }

        td.origin {
            width: 18%;
            color: var(--text-secondary);
            font-size: 1.4rem;
        }

        .rhs {
            display: block;
            font-family: var(--font-family-mono);
            font-size: 1.3rem;
            color: var(--text-secondary);
            word-break: break-all;
        }

        .source-config td.origin {
            color: var(--text-secondary-alternative);
        }

        mark {
            background: none;
            color: var(--accent-color);
            font-weight: 700;
        }

        #empty {
            text-align: center;
            color: var(--text-secondary);
        }

        @media (max-width: 640px) {
            td.mode,
            th.mode,
            td.origin,
            th.origin {
                display: none;
            }

            td.keys {
                width: 40%;
            }
        }
        /* #endregion */
    </style>
</head>

<body>
    <header>
        <h1>Neovim keymaps</h1>
        <p class="meta" id="meta"></p>
    </header>

    <div class="divider"></div>

    <div class="controls">
        <input id="search" type="search" placeholder="Search keys, descriptions, plugins…  ( / to focus, Esc to clear )"
            autocomplete="off" spellcheck="false" autofocus>
        <div class="filters">
            <label><input type="checkbox" data-source="config" checked> mine</label>
            <label><input type="checkbox" data-source="plugin" checked> plugins</label>
            <label><input type="checkbox" data-source="default" checked> Neovim defaults</label>
        </div>
        <span id="count"></span>
    </div>

    <main id="results"></main>
    <p id="empty" hidden>No mappings match.</p>

    <script src="keymaps.js"></script>
    <script>
        (function () {
            "use strict";

            var data = window.KEYMAPS;
            var results = document.getElementById("results");
            var search = document.getElementById("search");
            var count = document.getElementById("count");
            var empty = document.getElementById("empty");
            var boxes = document.querySelectorAll(".filters input");

            if (!data) {
                results.textContent = "keymaps.js not found. Run generate.lua first.";
                return;
            }

            var MODES = { n: "normal", i: "insert", v: "visual", s: "select", o: "operator", c: "command", t: "terminal" };
            var SOURCE_LABEL = { config: "mine", plugin: "plugin", default: "Neovim default", other: "other" };

            document.getElementById("meta").innerHTML =
                "Generated " + esc(data.generated) + " · Neovim " + esc(data.nvim) +
                " · <code>&lt;leader&gt;</code> = <kbd>" + esc(data.leader) + "</kbd> · " + data.maps.length + " mappings";

            // Pre-compute a lowercase search string per mapping
            data.maps.forEach(function (m) {
                var modes = m.mode.split(" ").map(function (x) { return MODES[x] || x; }).join(" ");
                m.haystack = [m.lhs, m.desc, m.rhs, m.context, m.plugin, m.file, modes, SOURCE_LABEL[m.source]]
                    .join(" ").toLowerCase();
            });

            function esc(s) {
                return String(s == null ? "" : s)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }

            // Wrap every search term found in the text with <mark>
            function highlight(text, terms) {
                var html = esc(text);
                terms.forEach(function (t) {
                    var e = esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    if (e) html = html.replace(new RegExp("(" + e + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
                });
                return html;
            }

            // "<leader>ca" -> <kbd>&lt;leader&gt;</kbd><kbd>c</kbd><kbd>a</kbd>
            function keys(lhs, terms) {
                return (lhs.match(/<[^>]+>|./g) || []).map(function (k) {
                    return "<kbd>" + highlight(k, terms) + "</kbd>";
                }).join("");
            }

            function origin(m) {
                var where = m.source === "config" ? m.file : m.source === "plugin" ? m.plugin : "";
                return esc(SOURCE_LABEL[m.source]) + (where ? " · " + esc(where) : "");
            }

            function render() {
                var q = search.value.trim().toLowerCase();
                var terms = q ? q.split(/\s+/) : [];
                var enabled = {};
                boxes.forEach(function (b) { enabled[b.dataset.source] = b.checked; });
                enabled.other = enabled.default;

                var groups = [], byKey = {}, shown = 0;
                data.maps.forEach(function (m) {
                    if (!enabled[m.source]) return;
                    if (!terms.every(function (t) { return m.haystack.indexOf(t) !== -1; })) return;
                    var key = m.source + "|" + m.context;
                    if (!byKey[key]) {
                        byKey[key] = { title: SOURCE_LABEL[m.source] + " — " + m.context, source: m.source, rows: [] };
                        groups.push(byKey[key]);
                    }
                    byKey[key].rows.push(m);
                    shown++;
                });

                results.innerHTML = groups.map(function (g) {
                    return "<section><h2>" + esc(g.title) + "<small>" + g.rows.length + "</small></h2>" +
                        "<table><thead><tr><th>Keys</th><th class='mode'>Mode</th><th>Description</th>" +
                        "<th class='origin'>Source</th></tr></thead><tbody>" +
                        g.rows.map(function (m) {
                            var desc = m.desc || "";
                            // Show the command only when it adds something to the description
                            var showRhs = m.rhs && m.rhs !== desc && !(desc && m.rhs === "Lua function");
                            var rhs = showRhs ? "<span class='rhs'>" + highlight(m.rhs, terms) + "</span>" : "";
                            return "<tr class='source-" + m.source + "'>" +
                                "<td class='keys'>" + keys(m.lhs, terms) + "</td>" +
                                "<td class='mode' title='" + esc(m.mode.split(" ").map(function (x) { return MODES[x] || x; }).join(", ")) + "'>" + esc(m.mode) + "</td>" +
                                "<td>" + highlight(desc, terms) + rhs + "</td>" +
                                "<td class='origin'>" + origin(m) + "</td></tr>";
                        }).join("") +
                        "</tbody></table></section>";
                }).join("");

                count.textContent = shown + " / " + data.maps.length;
                empty.hidden = shown !== 0;
            }

            search.addEventListener("input", render);
            boxes.forEach(function (b) { b.addEventListener("change", render); });

            // "/" focuses the search (like Neovim), Esc clears it
            document.addEventListener("keydown", function (e) {
                if (e.key === "/" && document.activeElement !== search) {
                    e.preventDefault();
                    search.focus();
                    search.select();
                } else if (e.key === "Escape") {
                    search.value = "";
                    render();
                    search.focus();
                }
            });

            render();
        })();
    </script>
</body>

</html>
